<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ilija · Unterschrift platzieren</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1520; --s1:#10202D; --s2:#16293A; --s3:#1E3547; --s4:#274257;
  --bdr:rgba(255,255,255,.055); --bdr2:rgba(255,255,255,.1);
  --g:#E0A82E; --g2:#C8871B; --gd:rgba(224,168,46,.08); --gg:rgba(224,168,46,.2);
  --tx:#E6EEF5; --tx2:#8FA6B8; --tx3:#4A6072;
  --green:#22c97c; --teal:#2dd4bf; --red:#ef4444; --rdim:rgba(239,68,68,.1);
  --f:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;font-size:16px}
body{font-family:var(--f);background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Topbar */
.topbar{display:flex;align-items:center;height:52px;padding:0 18px;background:var(--s1);border-bottom:1px solid var(--bdr);flex-shrink:0;gap:10px}
.back-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;font-size:.78rem;font-weight:500;color:var(--tx2);background:var(--s3);border:1px solid var(--bdr2);cursor:pointer;font-family:var(--f);text-decoration:none;transition:all .13s;white-space:nowrap}
.back-btn:hover{color:var(--tx);background:var(--s4)}
.tb-title{font-size:.83rem;font-weight:600;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{padding:8px 16px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;border:none;font-family:var(--f);transition:all .13s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-prim{background:var(--g);color:#0B1520}
.btn-prim:hover{background:var(--g2)}
.btn-ghost{background:var(--s3);color:var(--tx2);border:1px solid var(--bdr2)}
.btn-ghost:hover{background:var(--s4);color:var(--tx)}
.btn-sm{padding:5px 11px;font-size:.73rem}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}

/* Info-Leiste */
.infobar{padding:8px 18px;background:var(--gd);border-bottom:1px solid var(--gg);font-size:.75rem;color:var(--g);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;flex-wrap:wrap}

/* Seiten-Navigation */
.page-nav{display:flex;align-items:center;gap:8px;padding:7px 18px;background:var(--s1);border-bottom:1px solid var(--bdr);flex-shrink:0}
.page-info{font-size:.75rem;color:var(--tx2);min-width:80px;text-align:center}

/* Viewer */
.viewer{flex:1;overflow:auto;display:flex;justify-content:center;padding:28px 20px;background:var(--bg)}
.canvas-wrapper{position:relative;display:inline-block;line-height:0;flex-shrink:0}
#pdfCanvas{display:block;box-shadow:0 4px 28px rgba(0,0,0,.55)}

/* Unterschrift-Overlay (ziehbar + resizable) */
.sig-overlay{
  position:absolute;
  cursor:move;
  border:2px dashed rgba(224,168,46,.85);
  border-radius:5px;
  overflow:hidden;
  resize:both;
  min-width:60px;
  min-height:18px;
  user-select:none;
  touch-action:none;
  background:rgba(255,255,255,.04);
}
.sig-overlay img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.sig-label{
  position:absolute;
  top:-20px;left:0;
  font-size:10px;font-weight:700;color:var(--g);
  background:rgba(11,21,32,.85);
  padding:2px 6px;border-radius:3px;
  pointer-events:none;white-space:nowrap;
  font-family:var(--f);
}

/* Status-Meldungen */
.state-msg{text-align:center;padding:64px 24px;color:var(--tx3)}
.state-msg .icon{font-size:2.2rem;margin-bottom:14px;display:block}
.state-msg p{font-size:.83rem;line-height:1.65;margin-bottom:4px}
.state-msg strong{color:var(--tx2)}
.state-msg .btn{margin-top:18px}

/* Toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--s3);border:1px solid var(--bdr2);border-radius:8px;padding:10px 22px;font-size:.8rem;color:var(--tx);z-index:300;transition:transform .25s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar">
  <a href="/fristen" class="back-btn">← Zurück</a>
  <span class="tb-title">✍️ Unterschrift platzieren — {{ name | e }}</span>
  <button class="btn btn-prim" id="btnSave" onclick="speichern()" disabled>✓ Einbetten &amp; Speichern</button>
</header>

<div class="infobar">
  <span>Ziehe die <strong style="color:var(--g)">goldene Markierung</strong> an die richtige Stelle und passe die Größe an (untere rechte Ecke ziehen).</span>
  <span style="color:var(--tx3);font-size:.71rem">Seite wechseln mit den Pfeilen unten</span>
</div>

<div class="page-nav">
  <button class="btn btn-ghost btn-sm" id="btnPrev" onclick="wechselSeite(-1)" disabled>← Vorherige</button>
  <span class="page-info" id="pageInfo">Seite 1 / 1</span>
  <button class="btn btn-ghost btn-sm" id="btnNext" onclick="wechselSeite(1)"  disabled>Nächste →</button>
  <span style="flex:1"></span>
  <span style="font-size:.71rem;color:var(--tx3)">Zoom:</span>
  <button class="btn btn-ghost btn-sm" onclick="setScale(currentScale - 0.25)">−</button>
  <button class="btn btn-ghost btn-sm" onclick="setScale(currentScale + 0.25)">+</button>
</div>

<div class="viewer" id="viewer">
  <div id="stateMsg" class="state-msg">
    <span class="icon">⏳</span>
    <p>Dokument wird geladen…</p>
  </div>
  <div class="canvas-wrapper" id="canvasWrapper" style="display:none">
    <canvas id="pdfCanvas"></canvas>
    <div class="sig-overlay" id="sigOverlay" style="left:80px;top:700px;width:200px;height:55px">
      <div class="sig-label">Unterschrift</div>
      <img id="sigImg" src="" alt="">
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const VID = "{{ vid | e }}";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc       = null;
let currentPage  = 1;
let totalPages   = 1;
let currentScale = 1.4;
let currentVP    = null;

// ── Unterschrift laden ──────────────────────────────────────────────
async function ladeUnterschrift() {
  try {
    const r = await fetch('/api/fristen/unterschrift');
    const d = await r.json();
    if (d.ok && d.exists) {
      document.getElementById('sigImg').src = d.data;
      return true;
    }
  } catch {}
  document.getElementById('stateMsg').innerHTML = `
    <span class="icon">⚠️</span>
    <p>Keine Unterschrift hinterlegt.<br>
    Bitte erst unter <strong>👤 Meine Daten → Unterschrift</strong> eine Unterschrift hinterlegen.</p>
    <a href="/fristen" class="btn btn-ghost">← Zurück</a>`;
  return false;
}

// ── PDF laden ───────────────────────────────────────────────────────
async function ladePDF() {
  try {
    pdfDoc     = await pdfjsLib.getDocument(`/fristen/datei/${VID}`).promise;
    totalPages = pdfDoc.numPages;
    currentPage = totalPages; // Letzte Seite — Unterschrift meist dort
    await renderSeite(currentPage);
    updateNav();
    document.getElementById('canvasWrapper').style.display = 'inline-block';
    document.getElementById('stateMsg').style.display = 'none';
    document.getElementById('btnSave').disabled = false;
    positionDefault();
  } catch (err) {
    document.getElementById('stateMsg').innerHTML = `
      <span class="icon">❌</span>
      <p>Fehler beim Laden des Dokuments.<br>${esc(err.message || '')}</p>
      <a href="/fristen" class="btn btn-ghost">← Zurück</a>`;
  }
}

// ── Seite rendern ───────────────────────────────────────────────────
async function renderSeite(num) {
  const page = await pdfDoc.getPage(num);
  currentVP  = page.getViewport({ scale: currentScale });
  const canvas = document.getElementById('pdfCanvas');
  canvas.width  = currentVP.width;
  canvas.height = currentVP.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: currentVP }).promise;
  currentPage = num;
}

function updateNav() {
  document.getElementById('pageInfo').textContent = `Seite ${currentPage} / ${totalPages}`;
  document.getElementById('btnPrev').disabled = currentPage <= 1;
  document.getElementById('btnNext').disabled = currentPage >= totalPages;
}

async function wechselSeite(delta) {
  const z = currentPage + delta;
  if (z < 1 || z > totalPages) return;
  await renderSeite(z);
  updateNav();
}

async function setScale(s) {
  currentScale = Math.max(0.5, Math.min(3.0, Math.round(s * 4) / 4));
  if (pdfDoc) { await renderSeite(currentPage); }
}

function positionDefault() {
  const canvas  = document.getElementById('pdfCanvas');
  const overlay = document.getElementById('sigOverlay');
  // Linkes unteres Viertel (typische Unterschrift-Position)
  overlay.style.left   = Math.round(canvas.width * 0.05) + 'px';
  overlay.style.top    = Math.round(canvas.height * 0.80) + 'px';
  overlay.style.width  = '200px';
  overlay.style.height = '55px';
}

// ── Drag ────────────────────────────────────────────────────────────
const overlay = document.getElementById('sigOverlay');
let dragging = false, dStartX, dStartY, dOrigL, dOrigT;

overlay.addEventListener('pointerdown', e => {
  // Resize-Handle (untere rechte Ecke 18×18 px) nicht abfangen
  const r = overlay.getBoundingClientRect();
  if (e.clientX > r.right - 18 && e.clientY > r.bottom - 18) return;
  dragging = true;
  dStartX  = e.clientX;
  dStartY  = e.clientY;
  dOrigL   = parseInt(overlay.style.left)  || 0;
  dOrigT   = parseInt(overlay.style.top)   || 0;
  overlay.setPointerCapture(e.pointerId);
  e.preventDefault();
});

document.addEventListener('pointermove', e => {
  if (!dragging) return;
  overlay.style.left = (dOrigL + e.clientX - dStartX) + 'px';
  overlay.style.top  = (dOrigT + e.clientY - dStartY) + 'px';
});

document.addEventListener('pointerup', () => { dragging = false; });

// ── Speichern ────────────────────────────────────────────────────────
async function speichern() {
  const btn     = document.getElementById('btnSave');
  btn.disabled  = true;
  btn.textContent = '⏳ Wird gespeichert…';

  const wrapper = document.getElementById('canvasWrapper');
  const ov      = document.getElementById('sigOverlay');
  const wRect   = wrapper.getBoundingClientRect();
  const oRect   = ov.getBoundingClientRect();

  // Bildschirm-Position relativ zum Canvas-Container
  const sLeft = oRect.left - wRect.left;
  const sTop  = oRect.top  - wRect.top;
  const sW    = oRect.width;
  const sH    = oRect.height;

  // In PDF-Punkte umrechnen (PyMuPDF: Ursprung oben links)
  const scale = currentVP.scale;
  const body  = { page: currentPage - 1,
                  x: sLeft / scale, y: sTop / scale,
                  width: sW / scale, height: sH / scale };

  try {
    const r = await fetch(`/api/fristen/${VID}/unterschrift-einbetten`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      toast('Unterschrift eingebettet ✓');
      setTimeout(() => { window.location.href = '/fristen'; }, 1100);
    } else {
      alert('Fehler: ' + (d.error || 'Unbekannt'));
      btn.disabled = false;
      btn.textContent = '✓ Einbetten & Speichern';
    }
  } catch {
    alert('Netzwerkfehler');
    btn.disabled = false;
    btn.textContent = '✓ Einbetten & Speichern';
  }
}

// ── Hilfe ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  const ok = await ladeUnterschrift();
  if (ok) await ladePDF();
})();
</script>
</body>
</html>
