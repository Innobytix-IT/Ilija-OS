name: Tests

# Testsuite bei jedem Push und Pull Request auf main.
# Laeuft in einer Wegwerf-Umgebung - beruehrt nie echte Nutzerdaten
# (im Gegensatz zu einem pytest-Lauf auf einer Produktiv-Installation).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Test-Abhaengigkeiten installieren
        run: pip install -r requirements-ci.txt

      - name: Testsuite
        run: pytest tests/ -q
