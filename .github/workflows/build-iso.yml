name: ISO Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ilija-builder]
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ISO bauen
        run: sudo bash "$GITHUB_WORKSPACE/os/iso/build-iso.sh"
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Sanitize prüfen
        run: |
          set -e
          LISTING=$(unsquashfs -l /var/tmp/ilija-iso/iso/casper/filesystem.squashfs)

          # Muster fuer alles was NIE ins ISO gehoert
          BAD_PATTERNS='\.env$|geheimnis|web-auth|outlook_profil|Ilija-Ablage|\.pem$|\.pfx$|\.p12$|id_rsa$|id_ed25519$|id_ecdsa$|id_dsa$|\.gnupg/|\.ssh/|\.aws/|\.azure/|gcloud/|\.docker/config\.json|\.kube/config|\.git-credentials|\.netrc|\.pgpass|\.npmrc|\.pypirc|\.password-store/|\.thunderbird/|/etc/openvpn/|/etc/wireguard/|/etc/wpa_supplicant/|/var/backups/'

          # False-positives ausschliessen: System-Bibliotheken/Beispiele
          IGNORE='\.env\.example|snap/|usr/lib|usr/share|/venv/|node_modules|actions-runner|/etc/ssl/certs|python3/dist-packages'

          HITS=$(echo "$LISTING" | grep -Ei "$BAD_PATTERNS" | grep -vE "$IGNORE" || true)

          if [ -n "$HITS" ]; then
            echo "!!! FEHLER: KRITISCHE DATEIEN IM ISO GEFUNDEN !!!"
            echo "$HITS" | head -50
            echo "---"
            echo "(insgesamt $(echo "$HITS" | wc -l) Treffer)"
            exit 1
          fi
          echo "Sanitize OK - keine Credentials im ISO"

      - name: ISO splitten & hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /var/tmp/ilija-iso
          split -b 2000m ilija-os-24.04-amd64.iso ilija-os-24.04-amd64.iso.part
          sha256sum ilija-os-24.04-amd64.iso > SHA256SUMS
          TAG=${GITHUB_REF_NAME:-$(date +v%Y.%m.%d)}
          gh release delete "$TAG" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Ilija OS $TAG" \
            --notes "Automatisch gebaut via GitHub Actions (Self-Hosted Runner)" \
            ilija-os-24.04-amd64.iso.part* SHA256SUMS

      - name: Aufräumen
        if: always()
        run: rm -rf /var/tmp/ilija-iso
